    <rect x="180" y="88" width="271" height="142" rx="17" fill="url(#plane)" stroke="#b0b8ac" stroke-opacity=".3"/>
    <rect x="180" y="88" width="271" height="142" rx="17" fill="url(#microGrid)" opacity=".72"/>
    <path d="M202 199C231 191 252 195 274 177C299 156 321 174 344 150C367 126 390 148 429 112V213H202Z" fill="url(#ribbon)"/>
    <path d="M202 199C231 191 252 195 274 177C299 156 321 174 344 150C367 126 390 148 429 112" fill="none" stroke="#b8cf7e" stroke-opacity=".7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    <path d="M202 112H255M202 124H236" stroke="#d9ddd4" stroke-opacity=".35" stroke-linecap="round"/>
    <g fill="#e2e6dc" fill-opacity=".72">
