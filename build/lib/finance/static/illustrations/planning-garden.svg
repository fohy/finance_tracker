    <path d="M442 218a96 96 0 0 1-119 17" fill="none" stroke="#b9add8" stroke-opacity=".52" stroke-linecap="round" stroke-width="3"/>
    <g fill="#dfe4d8" stroke="#849075" stroke-width="1.5">
