      <rect x="407" y="133" width="9" height="27" rx="2" opacity=".24"/>
      <rect x="422" y="99" width="9" height="61" rx="2" opacity=".5"/>
    </g>
    <path d="M376 169H445" stroke="#dfdbe6" stroke-opacity=".24"/>
