<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">Абстрактная карта инвестиционного сценария</title>
  <desc id="desc">Полупрозрачные аналитические слои, временные деления и контуры данных</desc>
  <defs>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f1e8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#afb5aa" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="violetPlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9add8" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8d82aa" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b8cf7e" stop-opacity="0"/>
      <stop offset=".55" stop-color="#b8cf7e" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b8cf7e" stop-opacity=".38"/>
    </linearGradient>
    <pattern id="microGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#98a092" stroke-opacity=".15"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b201a" flood-opacity=".16"/>
    </filter>
  </defs>

  <g opacity=".8">
    <ellipse cx="371" cy="153" rx="126" ry="126" fill="none" stroke="#aeb6aa" stroke-opacity=".13"/>
    <ellipse cx="371" cy="153" rx="96" ry="96" fill="none" stroke="#aeb6aa" stroke-opacity=".2"/>
