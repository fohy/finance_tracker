      <path d="M180 61H245M472 61H525" stroke="#e1e2db" stroke-opacity=".45" stroke-linecap="round" stroke-width="3"/>
      <path d="M181 186C213 175 234 181 260 160C288 138 311 166 341 143C372 119 394 137 421 112C447 89 473 120 524 78V220H181Z" fill="url(#dataWash)"/>
