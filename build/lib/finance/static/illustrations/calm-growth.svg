    <circle cx="585" cy="91" r="18" fill="#f4f0e6" fill-opacity=".07" stroke="#d8d3e2" stroke-opacity=".24"/>
    <path d="M526 149H643M526 165H617M526 181H632" stroke="#e2dee8" stroke-opacity=".3" stroke-linecap="round"/>
