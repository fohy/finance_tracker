<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Финансовый обзор FinFlow</title>
  <desc id="desc">Спокойная редакционная композиция из полупрозрачных отчётов, графиков и аналитических сеток</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8ee" stop-opacity=".2"/>
      <stop offset="1" stop-color="#d9ddd2" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="lavenderGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8bee1" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8f85a9" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="dataWash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b8cf7e" stop-opacity="0"/>
      <stop offset="1" stop-color="#b8cf7e" stop-opacity=".24"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#9aa294" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#151915" flood-opacity=".2"/>
    </filter>
    <clipPath id="reportClip">
      <rect x="149" y="38" width="408" height="204" rx="18"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="718" height="278" rx="27" fill="url(#grid)" opacity=".72"/>
  <path d="M26 205H694M103 22V258M626 22V258" fill="none" stroke="#8f978b" stroke-opacity=".13"/>
  <ellipse cx="353" cy="239" rx="265" ry="20" fill="#1d211d" opacity=".12"/>

