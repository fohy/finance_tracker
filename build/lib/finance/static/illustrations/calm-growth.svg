      <g fill="#e6ebde" stroke="#7f8c71" stroke-width="2">
        <circle cx="260" cy="160" r="4"/>
        <circle cx="341" cy="143" r="4"/>
        <circle cx="421" cy="112" r="4"/>
        <circle cx="524" cy="78" r="4"/>
      </g>
