[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finflow"
version = "0.1.0"
description = "A private shared finance tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask==3.1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["finance*"]
exclude = ["deploy*", "scripts*", "tests*"]

[tool.setuptools.package-data]
finance = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I", "UP", "B"]
