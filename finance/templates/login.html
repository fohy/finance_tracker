<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0f19">
    <title>Вход · FinFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="brand login-brand">
            <div class="brand-mark">F</div>
            <div><strong>FinFlow</strong><span>семейные финансы</span></div>
        </div>
        <h1>С возвращением</h1>
        <p>Войдите в ваш общий финансовый центр.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="login-message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="post" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Логин<input name="login" autocomplete="username" required autofocus></label>
            <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
            <button class="btn btn-primary" type="submit">Войти</button>
        </form>
        <small>Нет аккаунта? Попросите владельца сервиса создать его локально.</small>
    </main>
</body>
</html>
