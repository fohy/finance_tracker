{% extends "base.html" %}
{% block content %}
<div class="period-toolbar">
    <div class="segmented period-segment"><button data-period="day">День</button><button data-period="week">Неделя</button><button data-period="month" class="active">Месяц</button></div>
    <div class="date-navigator"><button class="icon-btn" data-period-nav="prev" aria-label="Предыдущий период"><svg aria-hidden="true"><use href="{{ asset_url('icons.svg') }}#icon-chevron-left"></use></svg></button><button class="date-label" id="periodLabel" type="button" aria-label="Выбранный период">—</button><button class="icon-btn" data-period-nav="next" aria-label="Следующий период"><svg aria-hidden="true"><use href="{{ asset_url('icons.svg') }}#icon-chevron-right"></use></svg></button></div>
    <select class="person-filter" id="personFilter"><option value="">Все вместе</option></select>
</div>

<article class="card balance-hero dashboard-balance">
    <div class="card-kicker">На жизнь</div>
    <div class="hero-value" id="lifeBalance">—</div>
    <div class="balance-split balance-split--summary">
        <div><span>Инвестировано</span><strong id="investmentBalance">—</strong></div>
        <div><span>Всего денег</span><strong id="totalCapital">—</strong></div>
    </div>
</article>

<div class="dashboard-grid dashboard-grid--compact">
    <article class="card category-card"><div class="card-header"><h3>Бюджеты категорий</h3><a href="/settings" class="text-link">Настроить</a></div><div id="budgetOverview" class="category-list"><div class="loading-state" role="status">Проверяем лимиты…</div></div></article>
    <article class="card recent-card"><div class="card-header"><h3>Операции за период</h3><a href="/transactions" class="text-link">Все операции</a></div><div id="recentTransactions" class="transaction-list"><div class="loading-state" role="status">Загружаем операции…</div></div></article>
</div>
{% endblock %}
