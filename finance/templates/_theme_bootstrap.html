<script>
    (() => {
        const key = 'finflow-theme';
        let saved = null;
        try { saved = localStorage.getItem(key); } catch (error) { saved = null; }
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const mode = ({ dark: 'green', light: 'warm' })[saved] || (['green', 'graphite', 'warm', 'system'].includes(saved) ? saved : 'system');
        const theme = mode === 'system' ? (systemDark ? 'green' : 'warm') : mode;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.style.colorScheme = theme === 'warm' ? 'light' : 'dark';
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content', theme === 'warm' ? '#f5f1e8' : theme === 'graphite' ? '#1d2024' : '#20231f'
        );
    })();
</script>
