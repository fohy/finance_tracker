{% extends "base.html" %}
{% block content %}
<div class="period-toolbar">
    <div class="segmented period-segment"><button data-period="day">День</button><button data-period="week">Неделя</button><button data-period="month" class="active">Месяц</button></div>
    <div class="date-navigator"><button class="icon-btn" data-period-nav="prev">←</button><button class="date-label" id="periodLabel">—</button><button class="icon-btn" data-period-nav="next">→</button></div>
</div>
<div id="peopleMetrics" class="people-grid"></div>
{% endblock %}
