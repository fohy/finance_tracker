{% extends "base.html" %}
{% block content %}
<div class="period-toolbar">
    <div class="segmented period-segment">
        <button data-period="day">День</button><button data-period="week">Неделя</button><button data-period="month" class="active">Месяц</button>
    </div>
    <div class="date-navigator"><button class="icon-btn" data-period-nav="prev">←</button><button class="date-label" id="periodLabel">—</button><button class="icon-btn" data-period-nav="next">→</button></div>
    <select class="person-filter" id="personFilter"><option value="">Все люди</option></select>
</div>
<div class="card table-card">
    <div class="card-header table-tools">
        <div><div class="card-kicker">Журнал</div><h3>Все доходы и расходы</h3></div>
        <div class="toolbar-actions"><select id="txTypeFilter"><option value="">Все типы</option><option value="income">Доходы</option><option value="expense">Расходы</option><option value="transfer">Инвестиции</option><option value="interest">Проценты</option></select><button class="btn btn-secondary" id="addCategoryBtn">＋ Категория</button></div>
    </div>
    <div class="table-responsive">
        <table><thead><tr><th>Дата</th><th>Операция</th><th>Категория / заметка</th><th>Человек</th><th>Счёт</th><th class="align-right">Сумма</th><th></th></tr></thead><tbody id="transactionsTable"></tbody></table>
    </div>
    <div class="pagination" id="transactionsPagination"></div>
</div>
{% endblock %}
