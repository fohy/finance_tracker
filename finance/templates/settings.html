{% extends "base.html" %}
{% block content %}
<div class="settings-layout">
    <form class="card settings-card" id="settingsForm">
        <div class="card-header"><div><h3>План</h3><p class="muted">Целевые значения, не фактические операции.</p></div></div>
        <label>Цель накоплений, %<input type="number" name="investment_target_percent" min="0" max="100" step="0.1"></label>
        <label>Цель валютного резерва, %<input type="number" name="currency_target_percent" min="0" max="100" step="0.1"></label>
        <label>Не тратить больше за месяц<input type="number" name="monthly_life_budget" min="0" step="100"></label>
        <label>Знак основной валюты<input type="text" name="currency" maxlength="3"><small>Например, ₽ или $. Отображается рядом с суммами.</small></label>
        <label>ISO-код основной валюты<input type="text" name="base_currency_code" maxlength="3" placeholder="RUB"><small>Например, RUB или USD. Используется для оценки валютных счетов.</small></label>
        <button class="btn btn-primary" type="submit">Сохранить настройки</button>
    </form>
    <article class="card settings-card"><div class="card-header"><h3>Категории и лимиты</h3><div class="card-actions"><button class="btn btn-ghost" id="addSettingsCategory"><svg aria-hidden="true"><use href="{{ asset_url('icons.svg') }}#icon-plus"></use></svg>Категория</button><button class="btn btn-secondary" id="addBudgetBtn"><svg aria-hidden="true"><use href="{{ asset_url('icons.svg') }}#icon-plus"></use></svg>Лимит</button></div></div><div id="budgetSettings" class="category-list"><div class="loading-state" role="status">Загружаем лимиты…</div></div></article>
    <article class="card settings-card accounts-settings">
        <div class="card-header"><h3>Счета</h3><button class="btn btn-primary" id="addAccountBtn"><svg aria-hidden="true"><use href="{{ asset_url('icons.svg') }}#icon-plus"></use></svg>Добавить счёт</button></div>
        <div id="accountSettings" class="account-settings-list"><div class="loading-state" role="status">Загружаем счета…</div></div>
    </article>
</div>
{% endblock %}
